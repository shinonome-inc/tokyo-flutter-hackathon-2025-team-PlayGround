openapi: 3.0.3
info:
  title: 限界飯レシピAPI
  description: |
    画面遷移図およびDynamoDB設計に基づいたAPI定義。
    アクセスパターン（No.1〜11）をカバーするように設計されています。

    ## 認証について
    - GET系エンドポイント: 認証不要（未ログインユーザーも利用可能）
    - POST/PUT/DELETE系エンドポイント: Bearer Token認証が必要
    - 認証が必要なエンドポイントには `security` が設定されています
  version: 1.0.0

servers:
  - url: https://api.genkaimeshi.com/v1

tags:
  - name: User
    description: ユーザー管理およびプロフィール関連の操作
  - name: Recipe
    description: レシピの閲覧、投稿、AI生成、およびリアクション操作

paths:
  # ----------------------------------------------------------------------------
  # Users
  # ----------------------------------------------------------------------------
  /users:
    get:
      tags:
        - User
      summary: ユーザー検索 / 一覧取得
      description: |
        - email指定あり: メールアドレスからユーザーを特定 (Access Pattern 10 / GSI3)
        - email指定なし: 全ユーザーを新しい順に取得 (Access Pattern 11 / GSI2)
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          description: 完全一致検索用メールアドレス
      responses:
        "200":
          description: ユーザーリスト（検索時は1件のみ含むリスト）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      tags:
        - User
      summary: ユーザー作成 (サインアップ時)
      description: 認証後にDB上のユーザーデータを作成する
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailAddress]
              properties:
                name:
                  type: string
                emailAddress:
                  type: string
                imageUrl:
                  type: string
      responses:
        "201":
          description: 作成されたユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      tags:
        - User
      summary: ユーザープロフィール詳細取得
      description: Access Pattern 1 (PK検索)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ユーザー詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags:
        - User
      summary: ユーザープロフィール編集
      description: ユーザー編集画面での保存
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/recipes:
    get:
      tags:
        - User
      summary: 特定ユーザーの投稿レシピ一覧取得
      description: Access Pattern 7 (GSI1検索)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: レシピ概要リスト
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeOverview"

  /users/{userId}/likes:
    get:
      tags:
        - User
      summary: 特定ユーザーのいいねしたレシピ一覧取得
      description: Access Pattern 8 (GSI1検索 / SK filter)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: レシピ概要リスト
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeOverview"

  # ----------------------------------------------------------------------------
  # Recipes
  # ----------------------------------------------------------------------------
  /recipes:
    get:
      tags:
        - Recipe
      summary: タイムライン（全レシピ）取得
      description: Access Pattern 9 (GSI2検索)
      responses:
        "200":
          description: 新着順のレシピ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeOverview"
    post:
      tags:
        - Recipe
      summary: レシピ新規作成（手動投稿 / AI生成結果の保存）
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateInput"
      responses:
        "201":
          description: 作成されたレシピ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"

  /recipes/ai-generate:
    post:
      tags:
        - Recipe
      summary: AIによるレシピ生成
      description: |
        画面遷移図の「レシピAI生成画面」に対応。
        ユーザーIDはAuthorizationヘッダーのJWTトークンから取得します。

        ## 使用パターン

        ### パターンA: 画像なしでレシピ生成（1ステップ）
        `prompt` のみを指定してリクエスト。
        AIがプロンプトに基づいてレシピを生成し、DynamoDBに保存して返却。

        ### パターンB: 画像付きでレシピ生成（2ステップ）
        1. `requiresImageUpload: true` を指定してリクエスト → presigned URLを取得
        2. 取得したURLにS3へ画像をアップロード
        3. `imageS3Key` を指定してリクエスト → 画像から食材を検出し、レシピを生成

        生成されたレシピは自動的にDynamoDBに保存されます。
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AiGenerateRequest"
                - $ref: "#/components/schemas/AiGeneratePresignedUrlRequest"
            examples:
              generateWithoutImage:
                summary: 画像なしでレシピ生成
                value:
                  prompt: "カレーのレシピを提案して"
              requestPresignedUrl:
                summary: Presigned URL取得
                value:
                  prompt: "この食材で作れるレシピを提案して"
                  requiresImageUpload: true
              generateWithImage:
                summary: 画像付きでレシピ生成
                value:
                  prompt: "この食材で作れるレシピを提案して"
                  imageS3Key: "abc-123.png"
      responses:
        "200":
          description: |
            リクエスト内容によってレスポンスが異なります:
            - `requiresImageUpload: true` の場合: Presigned URLレスポンス
            - それ以外の場合: 生成されたレシピ詳細
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PresignedUrlResponse"
                  - $ref: "#/components/schemas/RecipeDetail"
              examples:
                presignedUrlResponse:
                  summary: Presigned URLレスポンス
                  value:
                    uploadUrl: "https://bucket.s3.ap-northeast-1.amazonaws.com/dev/recipe-images/abc-123.png?X-Amz-Algorithm=..."
                    imageS3Key: "abc-123.png"
                recipeResponse:
                  summary: レシピ生成レスポンス
                  value:
                    id: "12345678-1234-1234-1234-123456789012"
                    title: "レンジで3分！虚無うどん"
                    overview: "洗い物を出したくない日の救世主"
                    imageUrl: "https://bucket.s3.ap-northeast-1.amazonaws.com/dev/recipe-images/12345678.png"
                    isAiGenerated: true
                    createdAt: "2025-11-30T12:00:00Z"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingPrompt:
                  value:
                    error: "prompt is required and must be a string"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    error: "認証が必要です"

  /recipes/{recipeId}:
    get:
      tags:
        - Recipe
      summary: レシピ詳細一括取得
      description: |
        Access Pattern 2, 3, 4, 5, 6 を一括処理。
        DynamoDBの PK=RECIPE#{id} に対する Query を実行し、
        META(基本情報), INGREDIENT(材料), STEP(手順), COMMENT(コメント), LIKE(自身のいいね)
        を結合して返す。

        認証はオプショナル。認証ありの場合は isLikedByMe に自身のいいね状態が反映される。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: レシピ詳細（材料、手順、コメント含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
              example:
                id: "RECIPE#12345678"
                title: "レンジで3分！虚無うどん"
                overview: "洗い物を出したくない日の救世主。冷凍うどんをそのままチンするだけ。"
                imageUrl: "https://api.genkaimeshi.com/images/udon.jpg"
                isAiGenerated: false
                createdAt: "2025-11-20T19:00:00Z"
                user:
                  id: "USER#98765432"
                  name: "限界社会人A"
                  imageUrl: "https://api.genkaimeshi.com/users/icon_a.jpg"
                notes: "ネギはキッチンバサミで切れば包丁要らず。卵を入れると豪華になります。"
                ingredients:
                  - id: "INGREDIENT#01"
                    name: "冷凍うどん"
                    amount: "1玉"
                  - id: "INGREDIENT#02"
                    name: "めんつゆ（3倍濃縮）"
                    amount: "大さじ2"
                  - id: "INGREDIENT#03"
                    name: "ごま油"
                    amount: "ひとまわし"
                steps:
                  - orderNumber: 1
                    description: "耐熱皿に冷凍うどんを乗せ、ラップをして600Wで3分加熱。"
                  - orderNumber: 2
                    description: "めんつゆとごま油をかけて混ぜる。完成。"
                comments:
                  - id: "COMMENT#202511211000#abc"
                    userId: "USER#11111"
                    userName: "通りすがり"
                    description: "本当に楽でした！神レシピ。"
                    createdAt: "2025-11-21T10:00:00Z"
                isLikedByMe: true
                likeCount: 108

    put:
      tags:
        - Recipe
      summary: レシピ編集
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateInput"
      responses:
        "200":
          description: 更新完了
    delete:
      tags:
        - Recipe
      summary: レシピ削除
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 削除完了

  # ----------------------------------------------------------------------------
  # Interactions (Comments & Likes)
  # ----------------------------------------------------------------------------
  /recipes/{recipeId}/comments:
    post:
      tags:
        - Recipe
      summary: コメント投稿
      description: DynamoDBの SK=COMMENT#{created_at}#{id} を作成
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
      responses:
        "201":
          description: 作成されたコメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /recipes/{recipeId}/likes:
    post:
      tags:
        - Recipe
      summary: いいねを実行
      description: DynamoDBの SK=LIKE#{user_id} を作成
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: いいね完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLiked:
                    type: boolean
                    example: true

    delete:
      tags:
        - Recipe
      summary: いいねを取り消し
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: いいね削除完了

# ------------------------------------------------------------------------------
# Components / Schemas
# ------------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Cognito認証トークン（Authorization: Bearer {token}）"

  schemas:
    # --- User ---
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID (UUID)
        name:
          type: string
        imageUrl:
          type: string
        description:
          type: string
        emailAddress:
          type: string

    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
        imageUrl:
          type: string
        description:
          type: string

    # --- Recipe (Overview for Lists) ---
    RecipeOverview:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        overview:
          type: string
        imageUrl:
          type: string
        isAiGenerated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
          description: レシピの材料一覧
        likeCount:
          type: integer
          description: いいね数

    # --- Recipe (Full Detail) ---
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/RecipeOverview"
        - type: object
          properties:
            notes:
              type: string
            steps:
              type: array
              items:
                $ref: "#/components/schemas/Step"
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
            isLikedByMe:
              type: boolean
              description: リクエストしたユーザーが既にいいねしているか

    RecipeCreateInput:
      type: object
      required: [title, overview]
      properties:
        title:
          type: string
        overview:
          type: string
        imageUrl:
          type: string
        notes:
          type: string
        isAiGenerated:
          type: boolean
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"

    # --- Parts ---
    Ingredient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: string

    Step:
      type: object
      properties:
        orderNumber:
          type: integer
        description:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    # --- AI Generate ---
    AiGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: "AIへのプロンプト（例: 簡単に作れるレシピを提案して）"
        imageS3Key:
          type: string
          description: "S3にアップロードした画像のキー"

    AiGeneratePresignedUrlRequest:
      type: object
      required: [prompt, requiresImageUpload]
      properties:
        prompt:
          type: string
          description: "AIへのプロンプト"
        requiresImageUpload:
          type: boolean
          enum: [true]
          description: "trueを指定するとpresigned URLを返却するモードになる"

    PresignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          description: "S3へのアップロード用presigned URL"
        imageS3Key:
          type: string
          description: "アップロード後にリクエストで使用するS3キー"

    # --- Error ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: "エラーメッセージ"
        message:
          type: string
          description: "詳細なエラーメッセージ（オプション）"
