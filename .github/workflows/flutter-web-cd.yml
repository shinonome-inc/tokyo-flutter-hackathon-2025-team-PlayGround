name: Flutter Web CD

on:
  push:
    branches:
      - develop
      - main
      - feature/**
    paths:
      - "app/**"
      - ".github/workflows/flutter-web-cd.yml"

env:
  FLUTTER_VERSION: "3.38.1"
  AWS_REGION: "ap-northeast-1"

jobs:
  deploy:
    name: Deploy Flutter Web to AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        environment: [dev, prod]

    environment:
      name: aws-${{ matrix.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: app
        run: flutter build web --release

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get Terraform outputs
        working-directory: infra/aws/${{ matrix.environment }}
        run: |
          terraform init -backend-config="bucket=genkaimeshi-recipe-terraform-state" > /dev/null
          S3_BUCKET_NAME=$(terraform output -raw flutter_web_bucket_name 2>/dev/null)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw flutter_web_cloudfront_distribution_id 2>/dev/null)

          echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV

          echo "✓ Terraform outputs loaded successfully"

      - name: Deploy to S3 (dev)
        if: matrix.environment == 'dev' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        working-directory: app/build/web
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js"

          # index.html と flutter_service_worker.js は no-cache でアップロード
          aws s3 cp index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp flutter_service_worker.js s3://${{ env.S3_BUCKET_NAME }}/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deploy to S3 (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        working-directory: app/build/web
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js"

          # index.html と flutter_service_worker.js は no-cache でアップロード
          aws s3 cp index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp flutter_service_worker.js s3://${{ env.S3_BUCKET_NAME }}/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache (dev)
        if: matrix.environment == 'dev' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Invalidate CloudFront Cache (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Output deployment info (dev)
        if: matrix.environment == 'dev' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          echo "✅ Dev deployment completed successfully!"
          echo "S3 Bucket: ${{ env.S3_BUCKET_NAME }}"
          echo "CloudFront URL: https://${{ env.CLOUDFRONT_DISTRIBUTION_ID }}.cloudfront.net"

      - name: Output deployment info (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ Prod deployment completed successfully!"
          echo "S3 Bucket: ${{ env.S3_BUCKET_NAME }}"
          echo "CloudFront URL: https://${{ env.CLOUDFRONT_DISTRIBUTION_ID }}.cloudfront.net"
