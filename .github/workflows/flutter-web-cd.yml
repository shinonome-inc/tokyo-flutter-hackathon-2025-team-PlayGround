name: Flutter Web CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "app/**"
      - ".github/workflows/flutter-web-cd.yml"

env:
  FLUTTER_VERSION: "3.38.1"
  AWS_REGION: "ap-northeast-1"

jobs:
  deploy:
    name: Deploy Flutter Web to AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        environment: [dev, prod]

    environment:
      name: aws-${{ matrix.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: app
        run: flutter build web --release --web-renderer html

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deployment variables
        env:
          TF_VARS_DEV: ${{ secrets.TF_VARS_AWS_DEV }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_AWS_PROD }}
        run: |
          if [ "${{ matrix.environment }}" == "dev" ]; then
            echo "$TF_VARS_DEV" > /tmp/deploy.tfvars
          elif [ "${{ matrix.environment }}" == "prod" ]; then
            echo "$TF_VARS_PROD" > /tmp/deploy.tfvars
          fi

          # tfvarsからS3バケット名とCloudFront Distribution IDを抽出
          S3_BUCKET_NAME=$(grep 's3_bucket_name' /tmp/deploy.tfvars | cut -d'=' -f2 | tr -d ' "')
          CLOUDFRONT_DISTRIBUTION_ID=$(grep 'cloudfront_distribution_id' /tmp/deploy.tfvars | cut -d'=' -f2 | tr -d ' "')

          echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV

      - name: Deploy to S3 (dev)
        if: matrix.environment == 'dev' && github.ref == 'refs/heads/develop'
        working-directory: app/build/web
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js"

          # index.html と flutter_service_worker.js は no-cache でアップロード
          aws s3 cp index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp flutter_service_worker.js s3://${{ env.S3_BUCKET_NAME }}/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deploy to S3 (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        working-directory: app/build/web
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js"

          # index.html と flutter_service_worker.js は no-cache でアップロード
          aws s3 cp index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp flutter_service_worker.js s3://${{ env.S3_BUCKET_NAME }}/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache (dev)
        if: matrix.environment == 'dev' && github.ref == 'refs/heads/develop'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Invalidate CloudFront Cache (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Output deployment info (dev)
        if: matrix.environment == 'dev' && github.ref == 'refs/heads/develop'
        run: |
          echo "✅ Dev deployment completed successfully!"
          echo "CloudFront URL: https://${{ env.CLOUDFRONT_DISTRIBUTION_ID }}.cloudfront.net"

      - name: Output deployment info (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ Prod deployment completed successfully!"
          echo "CloudFront URL: https://${{ env.CLOUDFRONT_DISTRIBUTION_ID }}.cloudfront.net"
