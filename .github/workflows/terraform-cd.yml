name: Terraform CD

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-cd.yml"

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-northeast-1"

jobs:
  terraform-apply:
    name: Terraform Apply (${{ matrix.provider }}/${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [aws, gcp]
        environment: [dev, prod]

    environment:
      name: ${{ matrix.provider }}-${{ matrix.environment }}

    defaults:
      run:
        working-directory: infra/${{ matrix.provider }}/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure GCP Credentials
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform Init (dev)
        if: matrix.environment == 'dev' && github.ref == 'refs/heads/develop'
        run: terraform init

      - name: Terraform Apply (dev)
        if: matrix.environment == 'dev' && github.ref == 'refs/heads/develop'
        run: terraform apply -auto-approve -input=false

      - name: Terraform Init (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: terraform init

      - name: Terraform Apply (prod)
        if: matrix.environment == 'prod' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
