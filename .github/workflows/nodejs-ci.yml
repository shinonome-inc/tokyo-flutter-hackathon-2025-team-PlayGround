name: Node.js CI

on:
  push:
    paths:
      - "backend/lambda/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nodejs-ci.yml"
  pull_request:
    paths:
      - "backend/lambda/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nodejs-ci.yml"

jobs:
  test-lambdas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -w @genkaimeshi/lambda-base
