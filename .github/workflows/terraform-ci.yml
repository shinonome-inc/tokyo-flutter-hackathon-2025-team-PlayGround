name: Terraform CI

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "ap-northeast-1"

jobs:
  terraform-check:
    name: Terraform Check (${{ matrix.provider }}/${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [aws, gcp]
        environment: [dev, prod]

    defaults:
      run:
        working-directory: infra/${{ matrix.provider }}/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Lambda functions
        if: matrix.provider == 'aws'
        run: |
          set -e
          cd ../..  # リポジトリのルートディレクトリに移動

          echo "Current working directory: $PWD"
          echo "Backend Lambda directory contents:"
          ls -la backend/lambda

          cd backend/lambda
          npm ci

          # generate-ai-recipe のビルド
          echo "Building generate-ai-recipe"
          cd generate-ai-recipe
          npm ci
          npm run build
          zip -r ../dist/recipe_ai_generator.zip .
          cd ..

          # presigned-url のビルド
          echo "Building presigned-url"
          cd presigned-url
          npm ci
          npm run build
          zip -r ../dist/presigned_url.zip .
          cd ..

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure GCP Credentials
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Create terraform.tfvars (AWS)
        if: matrix.provider == 'aws'
        env:
          TF_VARS_DEV: ${{ secrets.TF_VARS_AWS_DEV }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_AWS_PROD }}
        run: |
          if [ "${{ matrix.environment }}" == "dev" ]; then
            printf '%s\n' "$TF_VARS_DEV" > terraform.tfvars
          elif [ "${{ matrix.environment }}" == "prod" ]; then
            printf '%s\n' "$TF_VARS_PROD" > terraform.tfvars
          fi

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -lock=false
        continue-on-error: true

      - name: Fail if errors
        if: steps.fmt.outcome == 'failure' || steps.init.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "Format check status: ${{ steps.fmt.outcome }}"
          echo "Init status: ${{ steps.init.outcome }}"
          echo "Validate status: ${{ steps.validate.outcome }}"
          echo "Plan status: ${{ steps.plan.outcome }}"
          echo "Current working directory: $(pwd)"
          ls -la
          exit 1
